<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>郎蔚光学项目管理系统</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">LW</div>
          <div>
            <strong>郎蔚光学</strong>
            <span>项目管理系统</span>
          </div>
        </div>
        <nav class="nav" aria-label="主导航">
          <button class="nav-item active" data-view="projects">项目管理</button>
          <button class="nav-item" data-view="procurement">采购管理</button>
          <button class="nav-item" data-view="receipts">入库管理</button>
          <button class="nav-item" data-view="settings">系统设置</button>
        </nav>
        <div class="scope-note">
          <span>当前版本</span>
          <strong>MVP · 项目负责人统一维护</strong>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-title-row">
            <div id="pageBackAction" class="page-back-action"></div>
            <div>
              <h1 id="pageTitle">项目管理</h1>
              <p id="pageSubtitle">查看项目列表、项目状态，并维护项目详情</p>
            </div>
          </div>
          <div class="topbar-actions">
            <input id="globalSearch" type="search" placeholder="搜索项目、采购、供应商" />
            <div id="pageActions" class="page-actions"></div>
          </div>
        </header>

        <section id="projects" class="view active-view">
          <section class="panel">
            <div class="filter-bar" aria-label="项目状态筛选">
              <button class="filter-chip active" data-project-filter="all">全部</button>
              <button class="filter-chip" data-project-filter="active">进行中</button>
              <button class="filter-chip" data-project-filter="ended">已结束</button>
            </div>
            <div id="projectCards" class="project-card-grid"></div>
          </section>
        </section>

        <section id="projectDetailPage" class="view">
          <section class="panel" id="projectDetail">
            <div class="detail-tabs" role="tablist" aria-label="项目详情">
              <button class="detail-tab active" data-detail-tab="overview">项目概览</button>
              <button class="detail-tab" data-detail-tab="tasks">项目任务</button>
              <button class="detail-tab" data-detail-tab="bom">项目 BOM 表</button>
              <button class="detail-tab" data-detail-tab="purchases">采购记录</button>
              <button class="detail-tab" data-detail-tab="receipts">入库记录</button>
            </div>
            <div id="detailOverview" class="detail-pane active-detail-pane"></div>
            <div id="detailTasks" class="detail-pane"></div>
            <div id="detailBom" class="detail-pane"></div>
            <div id="detailPurchases" class="detail-pane"></div>
            <div id="detailReceipts" class="detail-pane"></div>
          </section>
        </section>

        <section id="procurement" class="view">
          <section class="panel">
            <div class="toolbar-row">
              <label>项目筛选
                <select id="purchaseProjectFilter"></select>
              </label>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>采购编号</th>
                    <th>采购名称</th>
                    <th>项目</th>
                    <th>供应商</th>
                    <th>状态</th>
                    <th>预计到货</th>
                    <th>采购明细</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="purchaseRows"></tbody>
              </table>
            </div>
          </section>
        </section>

        <section id="receipts" class="view">
          <section class="panel">
            <div class="toolbar-row">
              <label>项目筛选
                <select id="receiptProjectFilter"></select>
              </label>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>BOM项</th><th>所属项目</th><th>采购记录</th><th>供应商</th><th>采购数量</th><th>已入库</th><th>未入库数量</th><th>入库状态</th><th>操作</th></tr>
                </thead>
                <tbody id="receiptRows"></tbody>
              </table>
            </div>
          </section>
        </section>

        <section id="settings" class="view">
          <section class="panel">
            <div id="settingsGrid" class="settings-grid"></div>
          </section>
        </section>
      </main>
    </div>

    <dialog id="projectDialog"></dialog>
    <dialog id="taskDialog"></dialog>
    <dialog id="materialDialog"></dialog>
    <dialog id="purchaseDialog"></dialog>
    <dialog id="purchaseDetailDialog"></dialog>
    <dialog id="purchaseItemDialog"></dialog>
    <dialog id="receiptDetailDialog"></dialog>
    <dialog id="receiptDialog"></dialog>
    <dialog id="settingOptionDialog"></dialog>

    <script src="./app.js"></script>
  </body>
</html>
